<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    

    <style>
        *{ margin: 0px;
        padding: 0px;}


        th, td{ border: 1px solid black;
        padding: 10px;
        width: 200px;}

        th{ background-color: grey;
        }

        table{ border-collapse: collapse;
        width: 500px; margin: auto;
        height: px;
        position: relative;}

        td{ text-align: right;}

        thead > tr > th{ 
                position: sticky;
                top: -1px;
        }

        .right{ text-align: left; 
                font-weight: bolder;}

        h1{
                padding-bottom: 3rem ;
                padding-top: 2rem;
                text-align: center;
                
        }
                caption{font-size: 2rem;
                        padding-bottom: 20px;
                        font-weight: bolder;}

        tbody > tr:nth-child(odd){ background-color: rgba(128, 128, 128, 0.521);}

    </style>




</head>
<body>
    <h1>Uso de tabelas grandes</h1>

        <!-- 
        Anotomia para tabelas grandes 
         
        caption
        
            table
            thead
                    (tr, td, th)
            tbody
                    (tr, td, th)
            tfoot
                    (tr, td, th)
            -->


        <table>
                <caption>População 2025</caption>
                <thead>
                        <th scope="col">Estados</th>
                        <th scope="col" style="width: 100px;">População</th>
                        <th scope="col" style="width: 100px;">População 2024</th>
                </thead>
                        <tr>
                              <td class="right">São Paulo</td>
                              <td>46 081 801</td> 
                              <td>450973 194</td> 
                        </tr>

                        <tr>
                                <td class="right">Minas Gerais</td>
                                <td>21 393 441</td>
                                <td>21 332 691</td>
                        </tr>
                        
                        <tr>
                                <td class="right">Rio de Janeiro</td>
                                <td>17 223 547</td>
                                <td>17 219 679</td>
                        </tr>
                <tbody>

                </tbody>
                <tfoot> 
                        <th scope="row">Total</th>
                        <td>00000</td>
                </tfoot>
        
        </table>
</body>
</html>
