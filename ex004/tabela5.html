<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
<style>

        table{ border-collapse: collapse;
                width: 500px;
                height: 70px;}

        td,th{ border: 1px solid black;}

        .enome{ background-color: gold;}
</style>

</head>
<body>
    <h1>Exercicios sobre Tabelas</h1> 
  <table>
    <colgroup>
        <col class="enome">
    </colgroup>
      
      <caption> CADASTRO</caption>
      <thead>
          <th scope="col">Nome</th>
          <th scope="col">Sexo</th>
          <th scope="col">Idade</th>
          <th scope="col">Profissão</th>
      </thead>
      <tr>
          <td>Ana</td>
          <td>Feminino</td>
          <td>21</td>
          <td>Clt</td>
      </tr>

      <tr>
        <td>Maria</td>
        <td>Feminino</td>
        <td>20</td>
        <td>Auxilar</td>
     </tr>

     <tr>
        <td>João</td>
        <td>Masculino</td>
        <td>27</td>
        <td>Mecanico</td>
     </tr>

     <tr>
        <td>Felipe</td>
        <td>Masculino</td>
        <td>32</td>
        <td>Gerente</td>
    </tr>
  </table>


    </body>
</html>
